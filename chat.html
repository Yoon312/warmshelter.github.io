<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Chat</title>
  <link rel="stylesheet" href="chat.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="image/logo.png" alt="Logo" class="logo">
      <div class="menu-container">
        <div class="menu">Menu</div>
      </div>
    </header>

    <h1 class="welcome-text">
      Winter Survival<br>
      <strong>Voice Chat</strong>
    </h1>

    <div class="card voice-chat-card">
      <div class="participant">
        <div class="avatar">
          <i class="fas fa-user"></i>
        </div>
        <div class="user-info">
          <span class="username">You</span>
          <div class="mic-controls">
            <button class="mic-btn active"><i class="fas fa-microphone"></i></button>
            <button class="volume-btn"><i class="fas fa-volume-up"></i></button>
          </div>
        </div>
      </div>

      <div class="participant">
        <div class="avatar">
          <i class="fas fa-user"></i>
        </div>
        <div class="user-info">
          <span class="username">Survival Expert</span>
          <div class="mic-controls">
            <div class="voice-active"><i class="fas fa-circle"></i> Speaking</div>
          </div>
        </div>
      </div>

      <div class="call-controls">
        <button class="call-btn end-call"><i class="fas fa-phone-slash"></i></button>
        <button class="call-btn mute"><i class="fas fa-microphone-slash"></i></button>
        <button class="call-btn speaker"><i class="fas fa-volume-up"></i></button>
      </div>
    </div>

    <div class="bottom-buttons">
      <a href="index.html" class="back-link">Leave Chat</a>
      <button class="continue-btn">More Options</button>
    </div>
  </div>
</body>
</html>
