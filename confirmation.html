<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Confirmation</title>
  <link rel="stylesheet" href="confirmation.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="image/logo.png" alt="Logo" class="logo">
      <div class="menu-container">
        <div class="menu">Menu</div>
      </div>
    </header>

    <h1 class="welcome-text">
      Your booking is confirmed!
    </h1>

    <div class="card confirmation-card">
      <div class="confirmation-icon">✓</div>
      <h2>Winter Survival Workshop</h2>
      
      <div class="confirmation-details">
        <div class="detail-row">
          <span class="detail-label">Date:</span>
          <span class="detail-value" id="confirmed-date">April 15, 2023</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Time:</span>
          <span class="detail-value" id="confirmed-time">10:30 AM</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Location:</span>
          <span class="detail-value">Survival Center, Room 5</span>
        </div>
      </div>

      <p class="confirmation-note">
        We've sent the details to your email. Please arrive 10 minutes early.
      </p>
    </div>

    <div class="bottom-buttons confirmation-buttons">
      <a href="index.html" class="back-link">Back to Home</a>
      <button class="continue-btn">Add to Calendar</button>
    </div>
  </div>

  <script>
    // URL에서 날짜와 시간 파라미터 추출
    const urlParams = new URLSearchParams(window.location.search);
    const bookingDate = urlParams.get('date') || 'Not Selected';
    const bookingTime = urlParams.get('time') || 'Not Selected';
  
    // 페이지에 선택한 날짜/시간 표시
    document.getElementById('confirmed-date').textContent = bookingDate;
    document.getElementById('confirmed-time').textContent = bookingTime;
  </script>
  
  
</body>
</html>
