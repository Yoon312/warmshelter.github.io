<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Warm Shelter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="logo">
        <img src="image/logo.png" alt="Logo" style="height:40px;">
      </div>
    </header>

    <h1><span>Morning Tom,</span><br>Welcome to<br>the Warm Shelter!</h1>
    <div class="card">
      <div class="text-content">
        <p class="title">Craft Workshops</p>
        <a href="workshop.html" class="action-button">Book a workshop</a>
      </div>
      <img src="image/craft.png" alt="Yarn Icon" class="icon">
    </div>

    <div class="card">
      <div class="text-content">
        <p class="title">Book your space</p>
        <a href="space.html" class="action-button">Continue to Book</a>
      </div>
      <img src="image/house.png" alt="House Icon" class="icon">
    </div>

    <div class="card">
      <div class="text-content">
        <p class="title">Our Voices Chat</p>
        <a href="chat.html" class="action-button">Continue to Chat</a>
      </div>
      <img src="image/microphone.png" alt="Mic Icon" class="icon">
    </div>
  </div>
</body>
</html>
